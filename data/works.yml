- title: 贄の王子
  status: 完結
  length: 全18話
  summary: |
    ヴェルダニア王国第一王子のリーネ(17)は王国の儀式と執務に日々を忙殺されていた。リーネの第一従者カイ(20)は側に控えながらも、現国王に瓜二つな自分の出自を探っていく。秘匿された情報が明かされた時、二人の運命は。
    従者×王子が運命に翻弄され行き着く先とは。
  tags: [異世界ファンタジー, ボーイズラブ]
  narou: https://ncode.syosetu.com/n1568mr/
  kakuyomu: https://kakuyomu.jp/works/2912051607762891829

- title: ガチで限界な社畜リーマンがBでLしかける話
